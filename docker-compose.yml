services:

  mysql:

    image: mysql:8.4

    container_name: umq-mysql

    restart: unless-stopped

    ports:

      - "3307:3306"

    environment:

      MYSQL_ROOT_PASSWORD: umq_root_password

      MYSQL_DATABASE: umq_platform

      MYSQL_USER: umq

      MYSQL_PASSWORD: umq_dev_password

    volumes:

      - umq_mysql_data:/var/lib/mysql

    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pumq_root_password"]

      interval: 5s

      timeout: 5s

      retries: 10



volumes:

  umq_mysql_data:

